[workspace]

[package]
name = "pallet_example"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ledger_me_sdk_guest = { path = "../../ledger_me_sdk_guest" }
borsh = { version = "1", default-features = false, features = ["derive"] }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
